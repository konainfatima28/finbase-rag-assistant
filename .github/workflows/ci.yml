name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only present when the repository secret exists; every step below works without it.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check app eval tests scripts
          ruff format --check app eval tests scripts
      - name: Type-check (mypy --strict)
        run: mypy
      - name: Corpus audit (Phase-0 gate)
        run: python -m app.audit --out /tmp/DATA_AUDIT.md --json-out /tmp/audit.json
      - name: Warm reranker model
        run: python -m app.retrieval.warm
      - name: Tests + coverage (no network, FakeLLM)
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Retrieval-only eval (offline; committed index + cached query embeddings)
        if: hashFiles('indexes/openai-text-embedding-3-small/manifest.json') != ''
        run: python -m eval.run --retrieval-only --no-latest --out /tmp/eval-retrieval.json
      - name: LLM-judged eval (only when the OPENAI_API_KEY secret is configured)
        if: env.OPENAI_API_KEY != '' && hashFiles('indexes/openai-text-embedding-3-small/manifest.json') != ''
        run: python -m eval.run --provider openai --judge openai --no-latest --out /tmp/eval-full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: /tmp/eval-*.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Build without NEXT_PUBLIC_API_URL (graceful)
        run: npm run build
      - name: Build with NEXT_PUBLIC_API_URL
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
      - name: Playwright smoke test (mocked API)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
