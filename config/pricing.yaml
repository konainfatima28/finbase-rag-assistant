# USD per 1M tokens, used only for cost *estimates* in logs, metrics and eval. Unknown models fall back to `default`.
# Source: https://developers.openai.com/api/docs/pricing (checked 2026-10-06). Update when prices change.
chat:
  gpt-4.1-mini: {input: 0.40, output: 1.60}
  gpt-4.1: {input: 2.00, output: 8.00}
  gpt-4.1-nano: {input: 0.10, output: 0.40}
  gpt-4o-mini: {input: 0.15, output: 0.60}
  gpt-6-luna: {input: 0.10, output: 0.50}
  default: {input: 2.00, output: 10.00}
embedding:
  text-embedding-3-small: 0.02
  text-embedding-3-large: 0.13
  default: 0.13
