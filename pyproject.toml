[project]
name = "finbase-assistant"
version = "1.0.0"
description = "FinBase FinTech customer-support assistant (production-grade RAG)"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web", ".venv", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PL", "T20"]
# E501: `ruff format` owns line length; remaining overruns are long literals (prompts, report text, regexes).
ignore = ["E501", "PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "N802", "PLC0415"]
# heavy PDF/DOCX libs are imported lazily so the API process never loads them (Render 512 MB)
"app/ingest/loaders.py" = ["PLC0415"]
# flashrank/onnxruntime imported only when RERANKER=flashrank is actually used
"app/retrieval/rerank.py" = ["PLC0415"]
"eval/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app", "eval"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "flashrank", "flashrank.*", "pdfplumber", "pdfplumber.*", "pymupdf", "pymupdf.*", "fitz", "docx", "docx.*", "slowapi", "slowapi.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "corpus: tests that read the real PDFs in data/raw (skipped if absent)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
