# Render Blueprint for the API (free tier: 512 MB RAM, sleeps when idle).
# The OpenAI index under indexes/ is committed, so the build never calls OpenAI.
services:
  - type: web
    name: finbase-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt && python -m app.retrieval.warm
    # Exactly one worker: without --workers, uvicorn uses $WEB_CONCURRENCY, which Render sets to its
    # recommended process count; every worker loads its own index + reranker (512 MB limit, D-034).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*' --no-access-log
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: openai
      - key: EMBED_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false # set in the Render dashboard; never committed
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: CORS_ORIGINS
        sync: false # e.g. https://<your-app>.vercel.app,http://localhost:3000
      - key: RATE_LIMIT
        value: 20/minute
      - key: LOG_LEVEL
        value: INFO
      # Memory on the 512 MB free tier (D-034): no host-sized OpenMP/OpenBLAS thread pools (FAISS searches
      # 250 vectors), and fewer glibc malloc arenas for the threaded Python process.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Fixed glibc mmap/trim thresholds (D-035): blocks >= 128 KB (the reranker's ~30 MB attention tensors)
      # are always mmap'ed and returned to the OS when freed. glibc's default dynamic threshold would
      # instead serve them from the heap after the first free and keep the RSS.
      - key: MALLOC_MMAP_THRESHOLD_
        value: "131072"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
